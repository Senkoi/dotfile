# Enable mouse mode(tmux 2.1 and above)
set -g mouse on
# Quality of life stuff
set -g history-limit 10000

## Join Windows
#bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"
#bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"

set -g extended-keys on

# Forward tmux copy-mode selections to the local terminal clipboard over SSH via OSC 52.
# Your local terminal must allow OSC 52 clipboard writes.
set -g set-clipboard on
# Use set, not append, so repeated reloads do not duplicate entries.
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,*:clipboard'

# Search Mode VI
set-window-option -g mode-keys vi

set -sg escape-time 0

# split panes using \ and -
#bind \\ split-window -h
#bind - split-window -v
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window  -c "#{pane_current_path}"
unbind '"'
unbind %

# don't rename windows automatically
set-option -g allow-rename off

# reload config file
bind r source-file ~/.tmux.conf

# switch panes using Alt-hjkl without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'tmux load-buffer -w -'
bind -Tcopy-mode-vi WheelUpPane { select-pane; send -N1 -X scroll-up  }
bind -Tcopy-mode-vi WheelDownPane { select-pane; send -N1 -X scroll-down  }
bind P paste-buffer 


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'
